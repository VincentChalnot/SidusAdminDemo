; Prod-oriented php.ini overrides for the frankenphp_prod target.
; Loaded from PHP_INI_SCAN_DIR=":${PHP_INI_DIR}/app.conf.d" on top of
; php.ini-production (see frankenphp/Dockerfile).

[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
; Symfony stats a lot of files (class/template/config lookups): cache the resolved paths.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = 'Europe/Paris'

[opcache]
opcache.enable = 1
; The code is baked into the image and immutable: never re-stat files for changes. A new
; release is a new image, so there is nothing to invalidate.
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
; Preload the framework + compiled container classes generated by the build-time cache warmup
; (see config/preload.php). The runtime user is not root, so no opcache.preload_user is needed.
opcache.preload = /app/config/preload.php
opcache.jit = tracing
opcache.jit_buffer_size = 128M

[apcu]
apc.enable_cli = 0
